name: Linear Hero Scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linear-hero-scroll.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make hero scroll constant-speed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """    const duration=1200;\n    let started=null;\n    const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;\n    const frame=time=>{\n      if(started===null)started=time;\n      const progress=Math.min((time-started)/duration,1);\n      window.scrollTo(0,start+distance*ease(progress));"""
          new = """    const duration=1200;\n    let started=null;\n    const frame=time=>{\n      if(started===null)started=time;\n      const progress=Math.min((time-started)/duration,1);\n      window.scrollTo(0,start+distance*progress);"""
          if old not in s:
              raise SystemExit('Expected scroll block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Verify linear scroll
        run: |
          grep -q 'window.scrollTo(0,start+distance\*progress)' index.html
          ! grep -q 'const ease=t=>' index.html

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use constant-speed hero scroll"
          git push
