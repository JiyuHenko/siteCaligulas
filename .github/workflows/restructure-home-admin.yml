name: Fix Home Programming Markup

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restructure-home-admin.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove extra closing div
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='</article>\n</div>\n</div>\n</div>\n</section>\n<div class="rule-line"></div>'
          new='</article>\n</div>\n</div>\n</section>\n<div class="rule-line"></div>'
          if old not in s:
              raise SystemExit('Expected extra closing div pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'const duration=300' index.html
          grep -q 'programacao-segunda-prime.webp' index.html
          grep -q 'programacao-quarta-free.webp' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix weekly programming markup"
          git push
