name: Restructure Home Programming

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restructure-home-admin.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update home programming
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('const duration=600;','const duration=300;',1)
          block=base64.b64decode('').decode()
          css=base64.b64decode('').decode()
          start=s.find('<div class="home-agenda">')
          end_marker='</div>\n</div>\n</section>\n<div class="rule-line"></div>'
          end=s.find(end_marker,start)
          if start<0 or end<0:
              raise SystemExit('programming markers not found')
          s=s[:start]+block+'\n'+s[end:]
          if '/* Weekly programming — poster + factual details */' not in s:
              marker='</style>\n<title>'
              if marker not in s:
                  raise SystemExit('style marker not found')
              s=s.replace(marker,css+'\n</style>\n<title>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Verify
        run: |
          grep -q 'const duration=300' index.html
          grep -q 'programacao-segunda-prime.webp' index.html
          grep -q 'programacao-quarta-free.webp' index.html
          grep -q 'Domingo Especial' index.html
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Rebuild weekly programming section and speed hero scroll"
          git push
