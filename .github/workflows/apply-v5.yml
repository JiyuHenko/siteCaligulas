name: Apply Caligulas responsive fix

on:
  push:
    paths:
      - '.github/apply-v5.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply responsive fix
        run: python scripts/apply_v5.py
      - name: Commit site update
        run: |
          rm -rf .github/v5_payload .github/apply-v5.trigger scripts/apply_v5.py
          rm -f .github/workflows/apply-v5.yml
          rmdir scripts 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix mobile galleries and tournament cards"
          git push
