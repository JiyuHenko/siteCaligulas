name: Optimize Caligulas PageSpeed

on:
  push:
    branches: [main]
    paths:
      - 'scripts/pagespeed_optimize.py'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install optimization tooling
        run: python -m pip install --disable-pip-version-check pillow beautifulsoup4 csscompressor rjsmin
      - name: Optimize images and critical delivery
        run: python scripts/pagespeed_optimize.py
      - name: Commit optimized site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Optimize PageSpeed delivery and responsive assets"
            git push
          fi
