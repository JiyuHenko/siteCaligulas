name: Final Caligulas Visual Polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-visual-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine regulation markup
        run: |
          python - <<'PY'
          from pathlib import Path
          reg = Path('regulamento.html')
          html = reg.read_text(encoding='utf-8')

          if 'class="regulamento-page"' not in html:
              html = html.replace('</head><body>', '</head><body class="regulamento-page">', 1)

          if 'class="regulation-content"' not in html:
              first = '<section class="section">\n<div class="narrow">\n<div class="rules-layout">'
              replacement = '<div class="regulation-content">\n<section class="section regulation-points">\n<div class="narrow">\n<div class="rules-layout">'
              html = html.replace(first, replacement, 1)

              marker = '<section class="section" style="padding-top:10px">'
              for name in ['regulation-factor', 'regulation-tiebreak', 'regulation-prizes', 'regulation-details']:
                  html = html.replace(marker, f'<section class="section {name}" style="padding-top:10px">', 1)

              idx = html.rfind('</main>')
              if idx != -1:
                  html = html[:idx] + '</div>\n' + html[idx:]

          reg.write_text(html, encoding='utf-8')
          PY

      - name: Append final styles
        run: |
          python - <<'PY'
          from pathlib import Path
          patch = Path('assets/css/v8-polish.css').read_text(encoding='utf-8')
          marker = '/* V8 — premium regulation desktop + unified footer */'
          for rel in ['assets/css/styles.css', 'assets/css/styles.min.css']:
              p = Path(rel)
              txt = p.read_text(encoding='utf-8')
              if marker not in txt:
                  txt += '\n' + patch
              p.write_text(txt, encoding='utf-8')
          PY

      - name: Commit polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add regulamento.html assets/css/styles.css assets/css/styles.min.css
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Polish regulation desktop and unify footer"
            git push
          fi
