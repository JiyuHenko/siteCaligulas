name: Refine Hero Scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-hero-scroll.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refine hero scroll motion
        env:
          NEW_BLOCK_B64: ""
        run: |
          python -c "from pathlib import Path; import os,base64; p=Path('index.html'); s=p.read_text(encoding='utf-8'); a='    const start=window.scrollY;'; b='    rafId=requestAnimationFrame(frame);'; i=s.find(a); j=s.find(b,i); assert i>=0 and j>=0; j+=len(b); n=base64.b64decode(os.environ['NEW_BLOCK_B64']).decode('utf-8'); p.write_text(s[:i]+n+s[j:],encoding='utf-8')"

      - name: Verify refined scroll
        run: |
          grep -q 'const averageSpeed=760' index.html
          grep -q 'const edge=.14' index.html
          grep -q 'const motion=t=>' index.html

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refine hero scroll motion"
          git push
