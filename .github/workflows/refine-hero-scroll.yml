name: Refine Hero Scroll

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refine-hero-scroll.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace complete hero scroll script
        env:
          SCRIPT_B64: ""
        run: |
          python -c "from pathlib import Path; import os,base64; p=Path('index.html'); s=p.read_text(encoding='utf-8'); a='<script>\n(()=>{\n  const trigger=document.querySelector(\'[data-slow-scroll]\');'; b='</script>\n<script defer=\"\" src=\"config.js\">'; i=s.find(a); j=s.find(b,i); assert i>=0 and j>=0; n=base64.b64decode(os.environ['SCRIPT_B64']).decode('utf-8'); p.write_text(s[:i]+n+'\n'+s[j+len('</script>\n'):],encoding='utf-8')"

      - name: Verify complete script
        run: |
          grep -q 'const averageSpeed=760' index.html
          grep -q 'const motion=t=>' index.html
          test "$(grep -o 'data-slow-scroll' index.html | wc -l)" -ge 2

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Repair and refine hero scroll script"
          git push
