name: Apply final Caligulas redesign

on:
  push:
    branches:
      - redesign/site-structure-home
    paths:
      - '.github/workflows/apply-final-redesign.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/site-structure-home
          fetch-depth: 0

      - name: Install WebP tools
        run: sudo apt-get update -qq && sudo apt-get install -y webp

      - name: Apply final text files
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,pathlib
          files = {
            'index.html':'',
            'casa.html':'',
            'assets/js/site.js':'',
            'assets/css/chrome.css':''
          }
          for path, payload in files.items():
              pathlib.Path(path).write_bytes(gzip.decompress(base64.b64decode(payload)))
          PY

      - name: Optimize new weekly banners
        shell: bash
        run: |
          cwebp -quiet -q 84 -resize 600 900 'assets/img/events/SG PRIME CPS.PNG' -o assets/img/events/sg-prime-cps.webp
          cwebp -quiet -q 84 -resize 600 900 'assets/img/events/QR FREE CPS.PNG' -o assets/img/events/qr-free-cps.webp
          rm 'assets/img/events/SG PRIME CPS.PNG' 'assets/img/events/QR FREE CPS.PNG'

      - name: Validate key changes
        shell: bash
        run: |
          grep -q 'section class="section home-about"' index.html
          grep -q 'assets/img/events/sg-prime-cps.webp' index.html
          grep -q 'assets/img/events/qr-free-cps.webp' index.html
          grep -q 'Caligulas Poker Series' index.html
          grep -q '<h1 class="display display-small">Sobre.</h1>' casa.html
          grep -q 'icon-fill' assets/js/site.js
          test -s assets/img/events/sg-prime-cps.webp
          test -s assets/img/events/qr-free-cps.webp

      - name: Commit final redesign
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html casa.html assets/js/site.js assets/css/chrome.css assets/img/events/sg-prime-cps.webp assets/img/events/qr-free-cps.webp
          git add -u assets/img/events
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'Finalize home flow, about page and weekly banners'
          git push origin HEAD:redesign/site-structure-home
