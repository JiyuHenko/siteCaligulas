name: Align Sunday Program Card

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/align-sunday-card.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Align Sunday card height
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '</style>'
          css = '''
/* Keep Sunday Special visually aligned with the weekly cards */
.program-special .program-specs{grid-template-columns:repeat(2,minmax(0,1fr))}
.program-special .program-specs>div{grid-column:1/-1}
.program-special .program-specs>div:nth-child(3),.program-special .program-specs>div:nth-child(4){grid-column:auto;display:block}
.program-special .program-specs>div:nth-child(3){padding-right:12px}
.program-special .program-specs>div:nth-child(4){padding-left:12px;border-left:1px solid rgba(255,255,255,.08)}
.program-special .program-specs>div:nth-child(3) dt,.program-special .program-specs>div:nth-child(4) dt{margin-bottom:5px}
'''
          if 'Keep Sunday Special visually aligned' in s:
              raise SystemExit('Already applied')
          if marker not in s:
              raise SystemExit('Style marker not found')
          p.write_text(s.replace(marker, css + marker, 1), encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Align Sunday program card height"
          git push
