name: Optimize Caligulas Mobile Render

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mobile-render-optimize.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minifiers
        run: python -m pip install --disable-pip-version-check csscompressor rjsmin
      - name: Apply mobile render optimizations
        run: python scripts/mobile_render_optimize.py
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Stabilize mobile rendering and defer noncritical effects"
            git push
          fi
