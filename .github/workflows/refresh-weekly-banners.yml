name: Refresh weekly banners

on:
  push:
    branches: [redesign/site-structure-home]
    paths:
      - '.github/workflows/refresh-weekly-banners.yml'

permissions:
  contents: write

jobs:
  convert:
    if: github.event.head_commit.message == 'Convert new weekly banners to WebP'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/site-structure-home

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: pip install pillow

      - name: Convert and update references
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          root = Path('.')
          events = root / 'assets/img/events'
          jobs = [
              (events / 'SEGUNDA PRIME NOVO.PNG', events / 'segunda-prime.webp'),
              (events / 'QUARTA FREE NOVO.PNG', events / 'quarta-free.webp'),
          ]

          dims = {}
          for src, dst in jobs:
              with Image.open(src) as im:
                  if im.mode not in ('RGB', 'RGBA'):
                      im = im.convert('RGB')
                  elif im.mode == 'RGBA':
                      bg = Image.new('RGB', im.size, 'white')
                      bg.paste(im, mask=im.getchannel('A'))
                      im = bg
                  dims[dst.name] = im.size
                  im.save(dst, 'WEBP', quality=88, method=6)
                  print(f'{src.name}: {im.size[0]}x{im.size[1]} -> {dst.name}')

          replacements = {
              'assets/img/events/programacao-segunda-prime.webp': 'assets/img/events/segunda-prime.webp',
              'assets/img/events/sg-prime-cps.webp': 'assets/img/events/segunda-prime.webp',
              'assets/img/events/programacao-quarta-free.webp': 'assets/img/events/quarta-free.webp',
              'assets/img/events/qr-free-cps.webp': 'assets/img/events/quarta-free.webp',
          }

          for html_path in [root / 'index.html', root / 'agenda.html']:
              text = html_path.read_text(encoding='utf-8')
              for old, new in replacements.items():
                  text = text.replace(old, new)
              for filename, (w, h) in dims.items():
                  src = f'assets/img/events/{filename}'
                  pattern = re.compile(rf'(<img\s+[^>]*src="{re.escape(src)}"[^>]*)(>)')
                  def fix(match):
                      tag = match.group(1)
                      if re.search(r'\bwidth="\d+"', tag):
                          tag = re.sub(r'\bwidth="\d+"', f'width="{w}"', tag)
                      else:
                          tag += f' width="{w}"'
                      if re.search(r'\bheight="\d+"', tag):
                          tag = re.sub(r'\bheight="\d+"', f'height="{h}"', tag)
                      else:
                          tag += f' height="{h}"'
                      return tag + match.group(2)
                  text = pattern.sub(fix, text)
              html_path.write_text(text, encoding='utf-8')

          site_js = root / 'assets/js/site.js'
          text = site_js.read_text(encoding='utf-8')
          text = re.sub(r'\n  function upgradeProgramPosters\(\) \{.*?\n  \}\n\n  function mountFloatingSocials', '\n  function mountFloatingSocials', text, flags=re.S)
          text = text.replace('  upgradeProgramPosters();\n', '')
          site_js.write_text(text, encoding='utf-8')

          for old in [
              events / 'SEGUNDA PRIME NOVO.PNG',
              events / 'QUARTA FREE NOVO.PNG',
              events / 'programacao-segunda-prime.webp',
              events / 'programacao-quarta-free.webp',
              events / 'sg-prime-cps.webp',
              events / 'qr-free-cps.webp',
          ]:
              if old.exists():
                  old.unlink()
          PY

      - name: Commit converted banners
        run: |
          git config user.name 'JiyuHenko'
          git config user.email '87832816+JiyuHenko@users.noreply.github.com'
          git add -A
          git commit -m 'Replace weekly banners with final WebP assets'
          git push origin HEAD:redesign/site-structure-home
