name: Audit Caligulas Lighthouse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/lighthouse-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wait for Pages
        run: sleep 8
      - name: Run Lighthouse mobile
        run: |
          npx --yes lighthouse@12.8.2 https://jiyuhenko.github.io/siteCaligulas/ \
            --quiet --chrome-flags='--headless --no-sandbox' \
            --output=json --output-path=/tmp/mobile.json
      - name: Run Lighthouse desktop
        run: |
          npx --yes lighthouse@12.8.2 https://jiyuhenko.github.io/siteCaligulas/ \
            --quiet --preset=desktop --chrome-flags='--headless --no-sandbox' \
            --output=json --output-path=/tmp/desktop.json
      - name: Print final summary
        run: |
          node - <<'NODE'
          const fs=require('fs');
          for(const mode of ['mobile','desktop']){
            const r=JSON.parse(fs.readFileSync(`/tmp/${mode}.json`,'utf8'));
            const a=r.audits,c=r.categories;
            const pct=k=>Math.round(c[k].score*100);
            console.log(`FINAL_${mode.toUpperCase()} performance=${pct('performance')} accessibility=${pct('accessibility')} best_practices=${pct('best-practices')} seo=${pct('seo')}`);
            console.log(`METRICS_${mode.toUpperCase()} FCP=${a['first-contentful-paint'].displayValue} LCP=${a['largest-contentful-paint'].displayValue} TBT=${a['total-blocking-time'].displayValue} SI=${a['speed-index'].displayValue} CLS=${a['cumulative-layout-shift'].displayValue}`);
            console.log(`RESPONSIVE_IMAGES_${mode.toUpperCase()} ${a['uses-responsive-images']?.displayValue||'ok'}`);
            console.log(`CACHE_${mode.toUpperCase()} ${a['uses-long-cache-ttl']?.displayValue||'ok'}`);
          }
          NODE
