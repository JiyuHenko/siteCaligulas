name: Caligulas site quality

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'config.js'
      - 'assets/css/**'
      - 'assets/js/**'
      - '.github/workflows/lighthouse-audit.yml'
  pull_request:
    paths:
      - '*.html'
      - 'config.js'
      - 'assets/css/**'
      - 'assets/js/**'
      - '.github/workflows/lighthouse-audit.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check obsolete build references
        run: |
          if grep -R -n -E 'styles\.min\.css|site\.min\.js|api\.min\.js|ranking-page\.min\.js|ranking-fallback\.min\.js|home-program-align\.css' --include='*.html' --include='*.js' .; then
            echo "Obsolete generated asset reference found."
            exit 1
          fi

      - name: Serve site
        run: |
          python3 -m http.server 4173 > /tmp/caligulas-http.log 2>&1 &
          sleep 2

      - name: Lighthouse mobile
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ \
            --quiet \
            --chrome-flags='--headless --no-sandbox' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=/tmp/mobile.json

      - name: Lighthouse desktop
        run: |
          npx --yes lighthouse@12.8.2 http://127.0.0.1:4173/ \
            --quiet \
            --preset=desktop \
            --chrome-flags='--headless --no-sandbox' \
            --only-categories=performance,accessibility,best-practices,seo \
            --output=json \
            --output-path=/tmp/desktop.json

      - name: Print summary
        run: |
          node - <<'NODE'
          const fs = require('fs');
          for (const mode of ['mobile', 'desktop']) {
            const report = JSON.parse(fs.readFileSync(`/tmp/${mode}.json`, 'utf8'));
            const c = report.categories;
            const a = report.audits;
            const pct = key => Math.round(c[key].score * 100);
            console.log(`${mode.toUpperCase()} performance=${pct('performance')} accessibility=${pct('accessibility')} best_practices=${pct('best-practices')} seo=${pct('seo')}`);
            console.log(`${mode.toUpperCase()} FCP=${a['first-contentful-paint'].displayValue} LCP=${a['largest-contentful-paint'].displayValue} TBT=${a['total-blocking-time'].displayValue} CLS=${a['cumulative-layout-shift'].displayValue}`);
          }
          NODE
