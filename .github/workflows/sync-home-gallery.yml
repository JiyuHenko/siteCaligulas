name: Sync home gallery preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-home-gallery.yml'

permissions:
  contents: write

jobs:
  sync-home-gallery:
    if: github.event.head_commit.message == 'Sync home gallery preview'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Keep home gallery tied to gallery page
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          section_anchor = '<h2 class="section-title">Dentro do Caligulas.</h2>'
          anchor_pos = html.index(section_anchor)
          grid_start = html.index('      <div class="gallery-grid">', anchor_pos)
          grid_content_start = html.index('\n', grid_start) + 1
          grid_end = html.index('      </div>', grid_content_start)

          fallback = '''        <figure class="gallery-item"><img src="assets/img/perf/photos/recent-01-720.webp" data-full="assets/img/photos/recent-01.webp" data-lightbox width="540" height="720" alt="Foto recente do Caligulas Poker Live" loading="lazy" decoding="async"></figure>\n        <figure class="gallery-item"><img src="assets/img/perf/photos/recent-02-720.webp" data-full="assets/img/photos/recent-02.webp" data-lightbox width="540" height="720" alt="Foto recente do Caligulas Poker Live" loading="lazy" decoding="async"></figure>\n        <figure class="gallery-item"><img src="assets/img/perf/photos/recent-03-720.webp" data-full="assets/img/photos/recent-03.webp" data-lightbox width="540" height="720" alt="Foto recente do Caligulas Poker Live" loading="lazy" decoding="async"></figure>\n        <figure class="gallery-item"><img src="assets/img/perf/photos/recent-04-720.webp" data-full="assets/img/photos/recent-04.webp" data-lightbox width="540" height="720" alt="Foto recente do Caligulas Poker Live" loading="lazy" decoding="async"></figure>\n'''
          html = html[:grid_content_start] + fallback + html[grid_end:]
          index.write_text(html, encoding='utf-8')

          site = Path('assets/js/site.js')
          js = site.read_text(encoding='utf-8')
          marker = '  function setupHomeRankingPreview() {'
          if 'function setupHomeGalleryPreview()' not in js:
              function = r'''  async function setupHomeGalleryPreview() {
    if (!document.body.classList.contains('home-page')) return;

    const grid = $('.gallery-grid');
    if (!grid) return;

    const targets = $$('[data-lightbox]', grid).slice(0, 4);
    if (targets.length < 4) return;

    try {
      const response = await fetch('galeria.html', { cache: 'no-cache' });
      if (!response.ok) return;

      const html = await response.text();
      const galleryDocument = new DOMParser().parseFromString(html, 'text/html');
      const sources = $$('.gallery-grid [data-lightbox]', galleryDocument).slice(0, 4);
      if (sources.length < 4) return;

      targets.forEach((target, index) => {
        const source = sources[index];
        ['src', 'srcset', 'sizes', 'width', 'height', 'alt', 'data-full'].forEach(attribute => {
          const value = source.getAttribute(attribute);
          if (value !== null) target.setAttribute(attribute, value);
          else target.removeAttribute(attribute);
        });
      });
    } catch (error) {
      // Keep the static fallback if the gallery page cannot be read.
    }
  }

'''
              js = js.replace(marker, function + marker, 1)

          init_marker = '  setupLightbox();\n  setupHomeRankingPreview();'
          if '  setupHomeGalleryPreview();\n' not in js:
              js = js.replace(init_marker, '  setupLightbox();\n  setupHomeGalleryPreview();\n  setupHomeRankingPreview();', 1)

          site.write_text(js, encoding='utf-8')
          PY

      - name: Commit home gallery sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/js/site.js
          git commit -m "Keep home gallery synced with latest photos"
          git push origin main